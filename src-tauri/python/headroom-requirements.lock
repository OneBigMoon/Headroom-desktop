cryptography==50.0.0; platform_machine != "x86_64" or sys_platform != "darwin"
# Intel mac: 48.0.1 is the last release with a universal2 wheel (49.0.0 dropped
# it). 50.0.0 has an sdist but building it needs a Rust toolchain users do not
# have, so Intel had no installable option at all. Real constraints in this set
# are msal (<51,>=2.5), pdfminer-six (>=36) and azure-identity (>=2.5), all
# satisfied. 48.0.1 carries GHSA-g6cj-pr64-35w5 (PKCS#7 EnvelopedData decryption
# oracle), GHSA-jwv3-5hgf-82ww (X.509 path-building DoS) and GHSA-m2h6-j472-rp4c
# (wildcard DNS escaping permittedSubtrees). All three were verified unreachable
# on 2026-08-17: nothing in headroom, litellm, pdfminer, msal or azure calls the
# PKCS#7 decryption API or the x509.verification path builder (msal uses pkcs12,
# unrelated). RE-CHECK THAT on any bump that adds a cert-verification or
# S/MIME dependency. Durable fix: build a 50.x universal2 wheel into
# vendor-wheels-v1 (same mechanism hnswlib already uses) and drop this line.
